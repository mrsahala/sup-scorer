<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>supdawg · A · Ribbon + map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./tokens.css" />
<style>
  body { padding: 0 0 48px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .mono { font-family: var(--mono); }

  /* ---------- header ---------- */
  .hdr { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .hdr-in { width: 100%; max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .wordmark { font-weight: 800; letter-spacing: -0.02em; font-size: 15px; display: inline-flex; align-items: center; gap: 7px; }
  .wordmark i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }

  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 0; }

  /* ---------- title block ---------- */
  .title-block { position: relative; }
  .title-row { display: flex; align-items: flex-start; gap: 10px; }
  .spot-btn { display: inline-flex; align-items: center; gap: 8px; text-align: left; font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15;
    border-radius: 10px; padding: 2px 6px 2px 0; min-width: 0; transition: color 160ms var(--ease); }
  .spot-btn:hover { color: var(--accent); }
  .spot-btn .chev { width: 18px; height: 18px; flex: none; color: var(--muted); transition: transform 220ms var(--ease), color 160ms var(--ease); margin-top: 3px; }
  .title-block[data-open="true"] .spot-btn .chev { transform: rotate(180deg); color: var(--accent); }
  .spot-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Narrow screens: two wrapped lines beat "Amsterda…" next to the thumbnail. */
  @media (max-width: 560px) {
    .spot-btn { font-size: 23px; align-items: flex-start; }
    .spot-btn .chev { margin-top: 5px; }
    .spot-name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.15; }
    .map-thumb { width: 50px; height: 50px; border-radius: 12px; }
  }
  .star { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); flex: none; margin-top: 1px;
    transition: color 160ms var(--ease), background 160ms var(--ease), transform 220ms var(--ease); }
  .star[hidden] { display: none; }
  .star:hover { background: var(--line-2); color: var(--fg); }
  .star svg { width: 20px; height: 20px; }
  .star[aria-pressed="true"] { color: var(--marginal); }
  .star[aria-pressed="true"] svg path { fill: currentColor; }
  .star.pop { transform: scale(1.25); }
  .gps[aria-pressed="true"] { color: var(--accent); }
  .gps.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sub { margin: 4px 0 0; color: var(--fg-2); font-size: 14px; min-height: 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sub .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tier, var(--muted)); flex: none; }
  .sub b { color: var(--fg); font-weight: 600; }

  /* ---------- map thumbnail + panel ---------- */
  .map-thumb { position: relative; flex: none; width: 56px; height: 56px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-2);
    box-shadow: var(--shadow); transition: transform 180ms var(--ease), border-color 160ms var(--ease); }
  .map-thumb:hover { transform: scale(1.04); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .map-thumb[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .map-thumb .tiles { position: absolute; width: 512px; height: 512px; display: grid; grid-template-columns: 256px 256px; }
  .map-thumb .tiles img { width: 256px; height: 256px; display: block; }
  .map-thumb .thumb-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -92%); filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
  @media (prefers-color-scheme: dark) { .map-thumb .tiles { filter: brightness(0.82) saturate(0.85); } }
  .map-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms var(--ease); }
  .map-panel > div { overflow: hidden; }
  .map-card { margin-top: 12px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    opacity: 0; transform: translateY(-6px); transition: opacity 200ms var(--ease), transform 220ms var(--ease); }
  .title-block[data-map="true"] .map-panel { grid-template-rows: 1fr; }
  .title-block[data-map="true"] .map-card { opacity: 1; transform: none; }
  .map { width: 100%; aspect-ratio: 4 / 3; max-height: 420px; background: var(--bg); }
  @media (prefers-color-scheme: dark) { .map .leaflet-tile-pane { filter: brightness(0.82) saturate(0.85); } }
  .map-foot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line-2); font-size: 13px; min-height: 48px; }
  .map-hint { color: var(--muted); }
  .map-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .map-name:empty { display: none; }
  .map-hint[hidden] { display: none; }
  .map-go { flex: none; padding: 8px 14px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 13px; }
  .map-go[hidden] { display: none; }
  .leaflet-container { font-family: inherit; }
  .picker-pin { background: none; border: none; }

  /* ---------- switcher ---------- */
  .switcher { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms var(--ease); }
  .switcher > div { overflow: hidden; }
  .switcher-card { margin-top: 12px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    opacity: 0; transform: translateY(-6px); transition: opacity 200ms var(--ease), transform 220ms var(--ease); }
  .title-block[data-open="true"] .switcher { grid-template-rows: 1fr; }
  .title-block[data-open="true"] .switcher-card { opacity: 1; transform: none; }
  .search-wrap { position: relative; padding: 10px; }
  .search-wrap svg { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .search { width: 100%; padding: 11px 12px 11px 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 15px; outline: none;
    transition: border-color 160ms var(--ease), box-shadow 160ms var(--ease); }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .list { display: grid; }
  .list:empty { display: none; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 14px; font-size: 14px; border-top: 1px solid var(--line-2); transition: background 120ms var(--ease); }
  .row:hover, .row.active { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .row .ic { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ty { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .row .rm { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); margin: -4px -6px -4px 0; }
  .row .rm:hover { background: color-mix(in srgb, var(--avoid) 14%, transparent); color: var(--avoid); }
  .list-h { padding: 10px 14px 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; border-top: 1px solid var(--line-2); }
  .hint { padding: 8px 14px 10px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line-2); }

  /* ---------- chips ---------- */
  .chips { display: flex; gap: 8px; margin: 14px -16px 0; padding: 0 16px 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chips:empty { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); font-size: 13px; font-weight: 500; color: var(--fg-2);
    transition: background 160ms var(--ease), color 160ms var(--ease), border-color 160ms var(--ease), transform 160ms var(--ease); max-width: 220px; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--tier, var(--muted)); flex: none; }
  .chip small { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--tier, var(--muted)); white-space: nowrap; }
  .chip small:empty { display: none; }
  .chip.active small { color: inherit; opacity: 0.75; }
  .chip:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); color: var(--fg); }
  .chip.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .chip:active { transform: scale(0.97); }

  /* ---------- days ---------- */
  .days { margin-top: 22px; display: grid; gap: 14px; transition: opacity 120ms var(--ease), transform 220ms var(--ease); }
  .days.leaving { opacity: 0; transform: translateY(-4px); }
  .days.entering { animation: enter 260ms var(--ease) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 14px 10px; }
  @media (prefers-color-scheme: light) { .card { box-shadow: var(--shadow); } }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .day-l { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .day-l small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
    background: color-mix(in srgb, var(--tier, var(--muted)) 16%, transparent); color: var(--tier, var(--muted)); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--tier, var(--muted)); }
  .pill.none { color: var(--muted); background: var(--line-2); }
  .pill .mono { font-weight: 500; }
  .meta { margin: 3px 0 8px; color: var(--muted); font-size: 12px; }

  .ribbon { position: relative; touch-action: pan-y; outline: none; border-radius: 8px; user-select: none; -webkit-user-select: none; }
  .ribbon:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .ribbon svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ribbon .stripe { fill: var(--fg); opacity: 0.025; }
  .ribbon .guide { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
  .ribbon .guide-l { font-family: var(--mono); font-size: 10px; fill: var(--tier); opacity: 0.85; }
  .ribbon .guide-l.in { font-size: 9px; opacity: 0.7; paint-order: stroke; stroke: var(--bg-2); stroke-width: 3px; stroke-linejoin: round; }
  .ribbon .gust-band { fill: var(--fg); opacity: 0.07; }
  .ribbon .gust-line { fill: none; stroke: var(--fg-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
  .ribbon .wind-area { fill: url(#windGrad); }
  .ribbon .wind-line { fill: none; stroke: var(--fg); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; opacity: 0.85; }
  .ribbon .tier-col { fill: var(--tier); opacity: 0.32; }
  .ribbon .strip { fill: var(--tier); opacity: 0.62; }
  .ribbon .strip.cold { opacity: 0.25; }
  .ribbon .win { fill: var(--tier); }
  .ribbon .win-l { font-size: 10px; font-weight: 600; fill: #06161a; }
  .ribbon .hx { font-family: var(--mono); font-size: 11px; fill: var(--muted); text-anchor: middle; }
  .ribbon .arrow { stroke: var(--muted); stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ribbon .now-line { stroke: var(--accent); stroke-width: 1.5; }
  .ribbon .now-dot { fill: var(--accent); stroke: var(--bg-2); stroke-width: 2; }
  .ribbon .now-l { font-family: var(--mono); font-size: 10px; font-weight: 600; fill: var(--accent); text-anchor: middle; }
  /* Selected-hour cursor: always visible, follows hover/drag, rests on the selection. */
  .ribbon .cursor { stroke: var(--fg); stroke-width: 1.5; opacity: 0.55; }
  .ribbon .cursor-dot { fill: var(--bg-2); stroke: var(--fg); stroke-width: 2; }
  .ribbon .col-hi { fill: var(--fg); opacity: 0.05; }
  .ribbon.dragging { cursor: ew-resize; }
  .ribbon .key { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .ribbon .key-wind { stroke: var(--fg); stroke-width: 2.2; opacity: 0.85; }
  .ribbon .key-gust { stroke: var(--fg-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
  .ribbon .hatch { fill: url(#hatch); }

  /* Fixed detail strip under each chart. Never covers the curve, always in the same place. */
  .detail { margin-top: 6px; padding: 8px 10px; border-radius: 9px; background: color-mix(in srgb, var(--tier, var(--muted)) 9%, transparent);
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; line-height: 1.3; min-height: 36px; transition: background 160ms var(--ease); }
  .detail .tm { font-family: var(--mono); font-weight: 600; font-size: 14px; }
  .detail .vd { font-weight: 700; color: var(--tier); }
  .detail .it { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-2); }
  .detail .it .mono { color: var(--fg); font-weight: 500; }
  .detail .it .ar { width: 12px; height: 12px; color: var(--fg-2); flex: none; }
  .detail .why { color: var(--muted); font-size: 12px; }
  .detail .why:empty { display: none; }
  @media (max-width: 560px) { .detail { font-size: 12.5px; gap: 3px 10px; } .detail .why { flex-basis: 100%; } }


  /* ---------- skeleton / error ---------- */
  .skel { height: 262px; border-radius: var(--radius); border: 1px solid var(--line); background: linear-gradient(100deg, var(--bg-2) 30%, color-mix(in srgb, var(--bg-2) 70%, var(--fg) 6%) 50%, var(--bg-2) 70%);
    background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -100% 0; } }
  .err { padding: 28px; text-align: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--line); border-radius: var(--radius); }
  .err button { margin-left: 8px; padding: 6px 12px; border-radius: 8px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 13px; }

  footer { max-width: 760px; margin: 28px auto 0; padding: 0 16px; color: var(--muted); font-size: 11px; display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <span class="wordmark"><i></i>supdawg</span>
</div></header>

<main>
  <section class="title-block" id="title-block" data-open="false">
    <div class="title-row">
      <button class="map-thumb" id="map-thumb" aria-expanded="false" aria-controls="map-panel" aria-label="Show this spot on a map" title="Show on map">
        <span class="tiles" id="thumb-tiles"></span>
        <svg class="thumb-pin" viewBox="0 0 26 26" width="22" height="22"><path d="M13 2C8.6 2 5 5.5 5 9.8c0 6 8 14 8 14s8-8 8-14C21 5.5 17.4 2 13 2z" fill="var(--poor)" stroke="#fff" stroke-width="1.5"/><circle cx="13" cy="9.8" r="3.2" fill="#fff"/></svg>
      </button>
      <button class="spot-btn" id="spot-btn" aria-expanded="false" aria-controls="switcher">
        <span class="spot-name" id="spot-name">Locating…</span>
        <svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <button class="star" id="star" aria-pressed="false" aria-label="Save this spot" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"/></svg>
      </button>
      <button class="star gps" id="gps" aria-pressed="false" aria-label="Use my location" title="Use my location">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="3"/><circle cx="10" cy="10" r="7"/><path d="M10 1v2M10 17v2M1 10h2M17 10h2"/></svg>
      </button>
    </div>
    <p class="sub" id="sub"></p>
    <div class="switcher" id="switcher"><div>
      <div class="switcher-card">
        <div class="search-wrap">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
          <input class="search" id="search" type="text" placeholder="Search any place in the Netherlands" autocomplete="off" spellcheck="false" />
        </div>
        <div class="list" id="results" role="listbox"></div>
        <div class="hint" id="hint" hidden></div>
        <div id="saved-h" class="list-h" hidden>Saved spots</div>
        <div class="list" id="saved"></div>
      </div>
    </div></div>
    <div class="map-panel" id="map-panel"><div>
      <div class="map-card">
        <div class="map" id="map"></div>
        <div class="map-foot">
          <span class="map-hint" id="map-hint">Drag the pin or tap the map to pick the exact spot</span>
          <span class="map-name" id="map-name"></span>
          <button class="map-go" id="map-go" hidden>Use this point</button>
        </div>
      </div>
    </div></div>
  </section>

  <div class="chips" id="chips"></div>
  <div class="days" id="days"></div>
</main>

<footer><span>Open-Meteo · PDOK</span></footer>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="windGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity="0.32"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--bg-2)" stroke-width="2.5"/>
    </pattern>
  </defs>
</svg>

<script type="module">
import * as C from "./core.js";
C.store.ns = "supdawg-a";

const $ = (s, r = document) => r.querySelector(s);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const Y_MAX = 40;
const THRESHOLDS = [["great", 10], ["good", 15], ["marginal", 20], ["poor", 25]];
const ICONS = {
  pin: '<svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18s-6-5.3-6-9.5a6 6 0 1 1 12 0C16 12.7 10 18 10 18z"/><circle cx="10" cy="8.5" r="2"/></svg>',
  star: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"/></svg>',
  x: '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>',
};

const state = { spot: null, forecast: null, sel: new Map() };

// Theme follows the OS (tokens.css keys off prefers-color-scheme); any old manual override is cleared.
try { localStorage.removeItem(C.store.key("theme")); } catch {}

// ---------- helpers ----------
const r1 = (n) => Math.round(n * 10) / 10;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shortName = (name) => name.split(",")[0].trim();

// Fritsch–Carlson monotone cubic -> SVG path.
function monotone(p) {
  const n = p.length;
  if (n < 2) return "";
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1].x - p[i].x; m[i] = (p[i + 1].y - p[i].y) / dx[i]; }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const tau = 3 / Math.sqrt(s); t[i] = tau * a * m[i]; t[i + 1] = tau * b * m[i]; }
  }
  let d = `M${r1(p[0].x)} ${r1(p[0].y)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += ` C${r1(p[i].x + h)} ${r1(p[i].y + h * t[i])} ${r1(p[i + 1].x - h)} ${r1(p[i + 1].y - h * t[i + 1])} ${r1(p[i + 1].x)} ${r1(p[i + 1].y)}`;
  }
  return d;
}

function reason(h) {
  if (h.gustDowngraded) return `gust-limited · gusts ${Math.round(h.gustKmh)} km/h`;
  if (h.coldLimited) return `too cold · ${Math.round(h.tempC)}°C`;
  if (h.tier !== "great") return `sustained ${Math.round(h.windKmh)} km/h`;
  return "";
}
function arrowSvg(deg, cls = "ar") {
  return `<svg class="${cls}" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${C.arrowRotation(deg)}deg)"><path d="M6 10V2M3 5l3-3 3 3"/></svg>`;
}

// ---------- title / sub ----------
function renderTitle() {
  const { spot, forecast } = state;
  $("#spot-name").textContent = shortName(spot.name);
  const star = $("#star");
  star.hidden = false;
  star.setAttribute("aria-pressed", String(C.store.isSaved(spot)));
  star.setAttribute("aria-label", C.store.isSaved(spot) ? "Remove from saved spots" : "Save this spot");
  $("#gps").setAttribute("aria-pressed", String(!!spot.gps));
  renderThumb(spot);
  const sub = $("#sub");
  if (!forecast) { sub.innerHTML = ""; return; }
  const today = forecast.days[0];
  const s = C.daySummary(today.hours);
  if (s.best) {
    const all = s.qualifyingHours === s.daylightHours;
    sub.className = `sub tier-${s.best.modeTier}`;
    sub.innerHTML = all
      ? `<i class="dot"></i><span><b>${C.TIER_LABEL[s.best.modeTier]}</b> all day today · ${today.hours.filter(h=>h.isDaylight).length}h of daylight</span>`
      : `<i class="dot"></i><span>Best today <b class="mono">${C.fmtRange(s.best)}</b> · <b>${C.TIER_LABEL[s.best.modeTier]}</b></span>`;
    return;
  }
  const next = forecast.days.slice(1).map((d) => ({ d, s: C.daySummary(d.hours) })).find((x) => x.s.best);
  sub.className = "sub";
  sub.innerHTML = next
    ? `<i class="dot"></i><span>No good window today · next <b>${C.dayLabel(next.d.date)}</b> <b class="mono">${C.fmtHour(next.s.best.startHour)}</b></span>`
    : `<i class="dot"></i><span>No good window in the next ${forecast.days.length} days</span>`;
}

// ---------- chips ----------
function renderChips() {
  const chips = $("#chips");
  const spots = C.store.spots();
  chips.innerHTML = spots.map((s, i) => `<button class="chip${C.sameSpot(s, state.spot) ? " active" : ""}" data-i="${i}"><i></i><span>${esc(shortName(s.name))}</span><small></small></button>`).join("");
  chips.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => pick(spots[Number(b.dataset.i)])));
  // Glance badge per chip: the next good window at that spot, so saved spots
  // can be compared without opening each one. Forecasts are cached, so this
  // costs one fetch per spot, ever.
  spots.forEach((s, i) => C.forecastFor(s).then((f) => {
    const b = chips.querySelector(`[data-i="${i}"]`);
    if (!b) return;
    const g = glance(f);
    b.classList.add(g.tier ? `tier-${g.tier}` : "tier-none");
    b.querySelector("small").textContent = g.text;
  }).catch(() => {}));
}
// {tier, text} for the first day with a qualifying window: "Today 08–10", "Tmrw all day", "Wed 13–19", or "no window".
function glance(f) {
  for (let i = 0; i < f.days.length; i++) {
    const s = C.daySummary(f.days[i].hours);
    if (!s.best) continue;
    const when = i === 0 ? "Today" : i === 1 ? "Tmrw" : C.dayLabel(f.days[i].date).slice(0, 3);
    const span = s.qualifyingHours === s.daylightHours ? "all day" : `${C.fmtHour(s.best.startHour).slice(0, 2)}–${C.fmtHour(s.best.endHour).slice(0, 2)}`;
    return { tier: s.best.modeTier, text: `${when} ${span}` };
  }
  return { tier: null, text: "no window" };
}

// ---------- days ----------
function renderDays() {
  const days = $("#days");
  days.innerHTML = "";
  state.forecast.days.forEach((day, i) => days.appendChild(renderDay(day, i)));
  days.querySelectorAll(".ribbon").forEach((r) => renderRibbon(r));
}

function renderDay(day, idx) {
  const s = C.daySummary(day.hours);
  const daylight = day.hours.filter((h) => h.isDaylight);
  const temps = daylight.map((h) => h.tempC);
  const card = document.createElement("section");
  card.className = "card";
  let pill;
  if (!s.best) pill = `<span class="pill none">No window</span>`;
  else if (s.qualifyingHours === s.daylightHours) pill = `<span class="pill tier-${s.best.modeTier}"><i></i>${C.TIER_LABEL[s.best.modeTier]} all day</span>`;
  else pill = `<span class="pill tier-${s.best.modeTier}"><i></i>${C.TIER_LABEL[s.best.modeTier]} <span class="mono">${C.fmtHour(s.best.startHour).slice(0,2)}–${C.fmtHour(s.best.endHour).slice(0,2)}</span></span>`;
  card.innerHTML = `
    <div class="card-h"><div class="day-l">${C.dayLabel(day.date)}<small>${C.dayDate(day.date)}</small></div>${pill}</div>
    <div class="meta">wind <span class="mono">${Math.round(s.minWind)}–${Math.round(s.maxWind)}</span> km/h · <span class="mono">${Math.round(Math.min(...temps))}–${Math.round(Math.max(...temps))}</span>°C · daylight <span class="mono">${daylight[0]?.hour}–${daylight[daylight.length-1]?.hour}</span></div>
    <div class="ribbon" tabindex="0" role="img" aria-label="Hourly conditions for ${C.dayLabel(day.date)}"></div>
    <div class="detail" aria-live="polite"></div>`;
  const ribbon = card.querySelector(".ribbon");
  ribbon._day = day;
  ribbon._hours = daylight;
  ribbon._idx = idx;
  ribbon._detail = card.querySelector(".detail");
  wireRibbon(ribbon);
  return card;
}

let clipSeq = 0;
function renderRibbon(rb, { animate = true } = {}) {
  const hours = rb._hours;
  const W = rb.clientWidth || 600;
  if (!hours.length) { rb.innerHTML = `<div class="err">No daylight hours</div>`; return; }
  // Narrow screens: threshold labels move inside the chart (left edge) so the ribbon keeps its width.
  const compact = W < 560;
  const padL = 6, padR = compact ? 8 : 66, top = 30, bottom = 150, axisY = bottom + 18, arrowY = bottom + 36, H = bottom + 46;
  const n = hours.length, colW = (W - padL - padR) / n;
  const x = (i) => padL + (i + 0.5) * colW;
  const y = (v) => bottom - (Math.min(v, Y_MAX) / Y_MAX) * (bottom - top);
  const ext = (key) => [{ x: padL, y: y(hours[0][key]) }, ...hours.map((h, i) => ({ x: x(i), y: y(h[key]) })), { x: W - padR, y: y(hours[n - 1][key]) }];
  const windPts = ext("windKmh"), gustPts = ext("gustKmh");
  const windLine = monotone(windPts);
  const windArea = `${windLine} L${r1(W - padR)} ${bottom} L${padL} ${bottom} Z`;
  const gustBand = `${monotone(gustPts)} ${monotone([...windPts].reverse()).replace(/^M/, "L")} Z`;
  const gustLine = monotone(gustPts);
  rb._geom = { padL, padR, colW, x, y, top, bottom, W, H, n, windPts };

  const stripes = hours.map((_, i) => i % 2 ? `<rect class="stripe" x="${r1(padL + i * colW)}" y="${top}" width="${r1(colW)}" height="${bottom - top}"/>` : "").join("");
  const guides = THRESHOLDS.map(([t, v]) => `<line class="guide" x1="${padL}" x2="${W - padR}" y1="${r1(y(v))}" y2="${r1(y(v))}"/>` +
    (compact
      ? `<text class="guide-l in tier-${t}" x="${padL + 3}" y="${r1(y(v) - 2.5)}">${C.TIER_LABEL[t].toLowerCase()} ≤${v}</text>`
      : `<text class="guide-l tier-${t}" x="${W - padR + 8}" y="${r1(y(v) + 3.5)}">${C.TIER_LABEL[t].toLowerCase()} ≤${v}</text>`)).join("");
  const wins = C.findWindows(hours);
  const inWin = new Set(wins.flatMap((w) => w.hours.map((h) => h.hourNum)));
  const strip = hours.map((h, i) => inWin.has(h.hourNum) ? "" :
    `<rect class="strip tier-${h.tier}${h.coldLimited ? " cold" : ""}" x="${r1(padL + i * colW + 0.5)}" y="4" width="${r1(colW - 1)}" height="8" rx="2"/>`).join("");
  const winRects = wins.map((w) => {
    const i0 = hours.findIndex((h) => h.hourNum === w.startHour);
    const wx = padL + i0 * colW + 0.5, ww = w.hours.length * colW - 1;
    const label = `${C.TIER_LABEL[w.modeTier]} ${w.hours.length}h`;
    return `<rect class="win tier-${w.modeTier}" x="${r1(wx)}" y="0" width="${r1(ww)}" height="16" rx="5"/>` +
      (ww > 62 ? `<text class="win-l" x="${r1(wx + ww / 2)}" y="11.5" text-anchor="middle">${label}</text>` : "");
  }).join("");
  const axis = hours.map((h, i) => (h.hourNum % 2 === 0 || n <= 6) ? `<text class="hx" x="${r1(x(i))}" y="${axisY}">${String(h.hourNum).padStart(2, "0")}</text>` : "").join("");
  const arrows = hours.map((h, i) => `<g transform="translate(${r1(x(i))} ${arrowY}) rotate(${C.arrowRotation(h.windDirDeg)})"><path class="arrow" d="M0 4.5V-4.5M-3 -1.5L0 -4.5l3 3"/></g>`).join("");

  let now = "";
  const nk = C.nowKey();
  const ni = hours.findIndex((h) => h.time.startsWith(nk));
  if (ni >= 0) {
    const frac = new Date().getMinutes() / 60;
    const nx = x(ni) + frac * colW;
    const y0 = y(hours[ni].windKmh), y1 = y((hours[ni + 1] || hours[ni]).windKmh);
    const ny = y0 + (y1 - y0) * frac;
    now = `<line class="now-line" x1="${r1(nx)}" x2="${r1(nx)}" y1="${top}" y2="${bottom}"/><circle class="now-dot" cx="${r1(nx)}" cy="${r1(ny)}" r="4"/><text class="now-l" x="${r1(nx)}" y="${top - 4}">now</text>`;
  }
  rb._nowIdx = ni;

  // Line key, top-right of the chart: the solid line is sustained wind, the dashed one gust.
  const kx = W - padR, ky = top - 6;
  const key = `<line class="key-gust" x1="${r1(kx - 40)}" x2="${r1(kx - 26)}" y1="${ky}" y2="${ky}"/><text class="key" x="${r1(kx - 22)}" y="${ky + 3.5}">gust</text>` +
    `<line class="key-wind" x1="${r1(kx - 98)}" x2="${r1(kx - 84)}" y1="${ky}" y2="${ky}"/><text class="key" x="${r1(kx - 80)}" y="${ky + 3.5}">wind</text>`;

  const id = `wipe${++clipSeq}`;
  const wipe = animate && !REDUCED ? `<clipPath id="${id}"><rect x="0" y="0" width="0" height="${H}"><animate attributeName="width" from="0" to="${W}" dur="0.55s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect></clipPath>` : "";
  const clip = wipe ? ` clip-path="url(#${id})"` : "";
  // Under the wind line, each hour column is tinted with its tier color, so
  // the chart shape and the verdict read as one thing.
  const areaId = `area${clipSeq}`;
  const tierCols = hours.map((h, i) => `<rect class="tier-col tier-${h.tier}" x="${r1(padL + i * colW)}" y="${top}" width="${r1(colW)}" height="${bottom - top}"/>`).join("");

  rb.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs>${wipe}<clipPath id="${areaId}"><path d="${windArea}"/></clipPath></defs>
    ${stripes}
    ${guides}
    <rect class="col-hi" x="0" y="${top}" width="${r1(colW)}" height="${bottom - top}"/>
    <g${clip}>
      <path class="gust-band" d="${gustBand}"/>
      <path class="wind-area" d="${windArea}"/>
      <g clip-path="url(#${areaId})">${tierCols}</g>
      <path class="gust-line" d="${gustLine}"/>
      <path class="wind-line" d="${windLine}"/>
      ${strip}${winRects}
    </g>
    ${axis}${arrows}${now}${key}
    <line class="cursor" x1="0" x2="0" y1="${top}" y2="${bottom}"/>
    <circle class="cursor-dot" cx="0" cy="0" r="4"/>
  </svg>`;

  // Selection: today opens on the current hour, other days on the start of
  // their best window (or the first hour). Kept across re-renders.
  if (state.sel.get(rb._day.date) == null) {
    const best = C.daySummary(hours).best;
    const def = ni >= 0 ? ni : best ? hours.findIndex((h) => h.hourNum === best.startHour) : 0;
    state.sel.set(rb._day.date, Math.max(0, def));
  }
  showHour(rb, state.sel.get(rb._day.date));
}

// Moves the cursor to hour i and fills the card's detail strip. Doesn't change the selection.
function showHour(rb, i) {
  const g = rb._geom, h = rb._hours[i];
  if (!g || !h) return;
  const cx = g.x(i);
  const svg = rb.querySelector("svg");
  svg.querySelector(".cursor").setAttribute("x1", cx); svg.querySelector(".cursor").setAttribute("x2", cx);
  const dot = svg.querySelector(".cursor-dot"); dot.setAttribute("cx", cx); dot.setAttribute("cy", g.y(h.windKmh));
  svg.querySelector(".col-hi").setAttribute("x", g.padL + i * g.colW);
  const d = rb._detail;
  d.className = `detail tier-${h.tier}`;
  d.innerHTML = `<span class="tm">${h.hour}</span><span class="vd">${C.TIER_LABEL[h.tier]}${h.gustDowngraded ? "*" : ""}</span>` +
    `<span class="it"><span class="mono">${r1(h.windKmh)} → ${r1(h.gustKmh)}</span> km/h</span>` +
    `<span class="it"><span class="mono">${r1(h.tempC)}°C</span></span>` +
    `<span class="it">from ${C.compass(h.windDirDeg)} ${arrowSvg(h.windDirDeg)}</span>` +
    `<span class="why">${reason(h)}</span>`;
  rb._shown = i;
}
function select(rb, i) { state.sel.set(rb._day.date, i); showHour(rb, i); }

// Hover previews an hour; press/drag selects continuously and the selection
// stays where the pointer lifts. Same model for mouse and touch, no modes.
function wireRibbon(rb) {
  const idxAt = (clientX) => {
    const g = rb._geom; if (!g) return -1;
    const rx = clientX - rb.getBoundingClientRect().left;
    return Math.max(0, Math.min(g.n - 1, Math.floor((rx - g.padL) / g.colW)));
  };
  rb.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    rb._drag = true; rb.classList.add("dragging");
    rb.setPointerCapture(e.pointerId);
    const i = idxAt(e.clientX); if (i >= 0) select(rb, i);
  });
  rb.addEventListener("pointermove", (e) => {
    const i = idxAt(e.clientX); if (i < 0 || i === rb._shown) return;
    if (rb._drag) select(rb, i);
    else if (e.pointerType === "mouse") showHour(rb, i);
  });
  const end = () => { rb._drag = false; rb.classList.remove("dragging"); };
  rb.addEventListener("pointerup", end);
  rb.addEventListener("pointercancel", end);
  rb.addEventListener("pointerleave", () => { if (!rb._drag) showHour(rb, state.sel.get(rb._day.date)); });
  rb.addEventListener("keydown", (e) => {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    e.preventDefault();
    const cur = state.sel.get(rb._day.date) ?? 0, last = rb._hours.length - 1;
    const i = e.key === "Home" ? 0 : e.key === "End" ? last : Math.max(0, Math.min(last, cur + (e.key === "ArrowRight" ? 1 : -1)));
    select(rb, i);
  });
}

new ResizeObserver(() => {
  clearTimeout(window._rsz);
  window._rsz = setTimeout(() => document.querySelectorAll(".ribbon").forEach((r) => renderRibbon(r, { animate: false })), 80);
}).observe($("#days"));

// ---------- loading / swapping ----------
async function load(spot, { first = false } = {}) {
  spot.gps = spot.gps || spot.source === "gps";
  state.spot = spot;
  C.store.set("lastSpot", { name: spot.name, lat: spot.lat, lon: spot.lon, gps: spot.gps });
  const days = $("#days");
  renderTitle();
  renderChips();
  if (!first) { days.classList.remove("entering"); days.classList.add("leaving"); await wait(120); }
  const skelTimer = setTimeout(() => { days.innerHTML = skeleton(); days.classList.remove("leaving"); }, first ? 0 : 160);
  try {
    const f = await C.forecastFor(spot);
    clearTimeout(skelTimer);
    if (state.spot !== spot) return;
    state.forecast = f;
    state.sel.clear();
    renderTitle();
    days.classList.remove("leaving");
    renderDays();
    days.classList.add("entering");
  } catch (err) {
    clearTimeout(skelTimer);
    days.classList.remove("leaving");
    days.innerHTML = `<div class="err">Couldn't load the forecast.<button id="retry">Retry</button></div>`;
    $("#retry").addEventListener("click", () => load(spot));
  }
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const skeleton = () => Array.from({ length: 4 }, () => `<div class="skel"></div>`).join("");

function pick(spot) {
  closeSwitcher();
  if (C.sameSpot(spot, state.spot)) return;
  load(spot);
}

// ---------- star ----------
$("#star").addEventListener("click", () => {
  const b = $("#star");
  if (C.store.isSaved(state.spot)) C.store.removeSpot(state.spot); else C.store.saveSpot(state.spot);
  b.classList.add("pop"); setTimeout(() => b.classList.remove("pop"), 220);
  renderTitle(); renderChips(); renderSaved();
});

// ---------- map thumbnail + pinpoint panel ----------
// Web Mercator tile coordinates (fractional) for a point at zoom z.
const TILE_URL = (z, x, y) => `https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/${z}/${x}/${y}.png`;
const THUMB_ZOOM = 12, THUMB_PX = 56;
function tileXY(lat, lon, z) {
  const n = 2 ** z, r = (lat * Math.PI) / 180;
  return { x: ((lon + 180) / 360) * n, y: ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * n };
}
// Static thumbnail: a 2x2 tile mosaic offset so the point sits in the
// center. No JS needed to *display* it, so the live site can render this
// server-side. Base tile is chosen so the point is never within 128px of
// the mosaic's edge.
function renderThumb(spot) {
  const { x, y } = tileXY(spot.lat, spot.lon, THUMB_ZOOM);
  const tx = Math.floor(x - 0.5), ty = Math.floor(y - 0.5);
  const px = (x - tx) * 256, py = (y - ty) * 256;
  const tiles = $("#thumb-tiles");
  tiles.style.left = `${THUMB_PX / 2 - px}px`;
  tiles.style.top = `${THUMB_PX / 2 - py}px`;
  tiles.innerHTML = [[tx, ty], [tx + 1, ty], [tx, ty + 1], [tx + 1, ty + 1]]
    .map(([a, b]) => `<img alt="" src="${TILE_URL(THUMB_ZOOM, a, b)}">`).join("");
}

let leafletReady = null, map = null, marker = null, pending = null;
const PIN_SVG = '<svg width="26" height="26" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg"><path d="M13 2C8.6 2 5 5.5 5 9.8c0 6 8 14 8 14s8-8 8-14C21 5.5 17.4 2 13 2z" fill="#e0693f" stroke="#fff" stroke-width="1.5"/><circle cx="13" cy="9.8" r="3.2" fill="#fff"/></svg>';
// Leaflet is only fetched the first time the panel opens.
function loadLeaflet() {
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((res, rej) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    const js = document.createElement("script"); js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; js.onload = res; js.onerror = rej;
    document.head.append(css, js);
  });
  return leafletReady;
}
async function openMap() {
  closeSwitcher();
  tb.dataset.map = "true"; $("#map-thumb").setAttribute("aria-expanded", "true");
  pending = null; $("#map-name").textContent = ""; $("#map-go").hidden = true; $("#map-hint").hidden = false;
  await loadLeaflet();
  if (tb.dataset.map !== "true") return;
  if (!map) {
    map = L.map($("#map"), { zoomControl: true, attributionControl: true }).setView([state.spot.lat, state.spot.lon], 14);
    L.tileLayer(TILE_URL("{z}", "{x}", "{y}"), { attribution: "&copy; PDOK / Kadaster", maxZoom: 19 }).addTo(map);
    marker = L.marker([state.spot.lat, state.spot.lon], {
      icon: L.divIcon({ className: "picker-pin", html: PIN_SVG, iconSize: [26, 26], iconAnchor: [13, 24] }), draggable: true,
    }).addTo(map).on("dragend", () => { const p = marker.getLatLng(); propose(p.lat, p.lng); });
    map.on("click", (e) => { marker.setLatLng(e.latlng); propose(e.latlng.lat, e.latlng.lng); });
  } else {
    marker.setLatLng([state.spot.lat, state.spot.lon]);
    map.setView([state.spot.lat, state.spot.lon], 14, { animate: false });
  }
  // The container grows from 0 during the expand animation.
  setTimeout(() => map.invalidateSize(), 240);
}
function closeMap() {
  tb.dataset.map = "false"; $("#map-thumb").setAttribute("aria-expanded", "false");
}
async function propose(lat, lon) {
  pending = { lat, lon };
  $("#map-hint").hidden = true; $("#map-name").textContent = "…"; $("#map-go").hidden = false;
  const name = (await C.reverseName(lat, lon)) || "Picked point";
  if (pending && pending.lat === lat && pending.lon === lon) { pending.name = name; $("#map-name").textContent = name; }
}
$("#map-thumb").addEventListener("click", () => tb.dataset.map === "true" ? closeMap() : openMap());
$("#map-go").addEventListener("click", () => {
  if (!pending) return;
  const p = pending; closeMap();
  pick({ name: p.name || "Picked point", lat: p.lat, lon: p.lon });
});

search.addEventListener("input", () => {
  const q = search.value.trim();
  clearTimeout(sTimer);
  if (!q) { sResults = []; results.innerHTML = ""; hint.hidden = true; return; }
  sTimer = setTimeout(async () => {
    const seq = ++sSeq;
    try {
      const r = await C.searchPlaces(q);
      if (seq !== sSeq) return;
      sResults = r; sActive = r.length ? 0 : -1;
      hint.hidden = r.length > 0; hint.textContent = "No matches";
      renderResults();
    } catch { if (seq === sSeq) { hint.hidden = false; hint.textContent = "Search failed"; } }
  }, 200);
});
search.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" && sResults.length) { e.preventDefault(); sActive = (sActive + 1) % sResults.length; renderResults(); }
  else if (e.key === "ArrowUp" && sResults.length) { e.preventDefault(); sActive = (sActive - 1 + sResults.length) % sResults.length; renderResults(); }
  else if (e.key === "Enter") { e.preventDefault(); const r = sResults[sActive >= 0 ? sActive : 0]; if (r) pick(r); }
});
function renderResults() {
  results.innerHTML = sResults.map((r, i) => `<button class="row${i === sActive ? " active" : ""}" role="option" data-i="${i}">${ICONS.pin}<span class="nm">${esc(r.name)}</span><span class="ty">${esc(r.type)}</span></button>`).join("");
  results.querySelectorAll(".row").forEach((b) => b.addEventListener("click", () => pick(sResults[Number(b.dataset.i)])));
}
function renderSaved() {
  const spots = C.store.spots();
  $("#saved-h").hidden = !spots.length;
  $("#saved").innerHTML = spots.map((s, i) => `<div class="row" data-i="${i}">${ICONS.star}<span class="nm">${esc(s.name)}</span><button class="rm" aria-label="Remove" data-rm="${i}">${ICONS.x}</button></div>`).join("");
  $("#saved").querySelectorAll(".row").forEach((row) => {
    row.addEventListener("click", (e) => {
      if (e.target.closest(".rm")) { C.store.removeSpot(spots[Number(row.dataset.i)]); renderSaved(); renderChips(); renderTitle(); return; }
      pick(spots[Number(row.dataset.i)]);
    });
  });
}
$("#gps").addEventListener("click", () => {
  const b = $("#gps");
  if (!navigator.geolocation || b.classList.contains("busy")) return;
  b.classList.add("busy");
  navigator.geolocation.getCurrentPosition(async (p) => {
    const lat = p.coords.latitude, lon = p.coords.longitude;
    const name = (await C.reverseName(lat, lon)) || "My location";
    b.classList.remove("busy");
    pick({ name, lat, lon, source: "gps" });
    // Show where the fix landed, so it can be checked and refined right away.
    openMap();
  }, () => {
    b.classList.remove("busy");
    b.title = "Couldn't get your location"; setTimeout(() => (b.title = "Use my location"), 2500);
  }, { timeout: 8000, maximumAge: 600000 });
});

// ---------- boot ----------
$("#days").innerHTML = skeleton();
// A pending geolocation permission prompt can hang locate() indefinitely:
// fall back to the default spot after 3s, then hop to GPS if it resolves later.
let booted = false;
const located = C.locate().then((spot) => { if (!booted || spot.source === "gps") { booted = true; load(spot, { first: !state.forecast }); } });
wait(3000).then(() => { if (!booted) { booted = true; load({ ...C.DEFAULT_SPOT }, { first: true }); } });
</script>

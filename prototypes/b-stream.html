<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>supdawg · stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./tokens.css" />
<style>
  :root { --hdr: 0px; --rail-w: 264px; --gutter: 18px; }
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); }

  /* ---------- layout ---------- */
  .app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100vh; }
  .rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; }
  .stream-col { display: flex; justify-content: center; }
  .stream { width: 100%; max-width: 640px; padding: 28px 24px 80px; }
  .mobile-head { display: none; }
  .backdrop { display: none; }

  /* ---------- rail ---------- */
  .rail-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 8px; }
  .brand { font-weight: 700; letter-spacing: -0.02em; font-size: 17px; }
  .brand small { font-weight: 500; color: var(--muted); font-size: 11px; margin-left: 6px; letter-spacing: 0.06em; text-transform: uppercase; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--fg-2); transition: background 120ms var(--ease); }
  .icon-btn:hover { background: var(--line-2); }
  .icon-btn svg { width: 18px; height: 18px; }
  .search { position: relative; padding: 6px 14px 10px; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); outline: none; transition: border-color 120ms var(--ease), box-shadow 120ms var(--ease); }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .search svg.lens { position: absolute; left: 25px; top: 18px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
  .results { display: none; margin-top: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); box-shadow: var(--shadow); overflow: hidden; }
  .results.show { display: block; }
  .results button { display: block; width: 100%; text-align: left; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--line-2); }
  .results button:last-child { border-bottom: 0; }
  .results button small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
  .results button:hover, .results button.active { background: var(--line-2); }
  .results .empty { padding: 10px 12px; font-size: 12.5px; color: var(--muted); }
  .rail-label { padding: 14px 18px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .spot-row { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 9px 14px 9px 18px; font-size: 13.5px; font-weight: 500; transition: background 120ms var(--ease); }
  .spot-row:hover { background: var(--line-2); }
  .spot-row.active { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .spot-row.active::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
  .spot-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spot-row .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .glance { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--fg-2); font-family: var(--mono); white-space: nowrap; }
  .glance i { width: 7px; height: 7px; border-radius: 50%; background: var(--tier, var(--line)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--tier, var(--line)) 25%, transparent); }
  .glance.pending i { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .spot-row .rm { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); opacity: 0; transition: opacity 120ms; background: var(--bg-2); }
  .spot-row:hover .rm { opacity: 1; }
  .spot-row .rm:hover { color: var(--avoid); background: var(--line-2); }
  .spot-row.has-rm:hover .glance { opacity: 0; }
  .rail-hint { padding: 8px 18px; font-size: 12px; color: var(--muted); }
  .rail-foot { margin-top: auto; padding: 12px 14px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }

  /* ---------- stream header ---------- */
  .stream-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; display: flex; align-items: center; gap: 8px; line-height: 1.15; }
  .star { width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); transition: color 120ms, transform 200ms var(--ease); flex: none; }
  .star:hover { background: var(--line-2); }
  .star.on { color: var(--marginal); }
  .star.on svg path { fill: currentColor; }
  .star.pop { transform: scale(1.25); }
  .star svg { width: 18px; height: 18px; }
  .summary { margin: 6px 0 0; font-size: 14px; color: var(--fg-2); }
  .summary b { color: var(--fg); font-weight: 600; }
  .summary .t { color: var(--tier); font-weight: 600; }
  .legend { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 7px; border-radius: 2px; background: var(--good); vertical-align: middle; margin-right: 3px; }
  .legend i.g { background: color-mix(in srgb, var(--good) 30%, transparent); margin-left: -3px; }

  /* ---------- grid shared by rows / headers ---------- */
  .g { display: grid; grid-template-columns: var(--gutter) 46px 52px minmax(0, 1fr) 46px 36px; column-gap: 8px; align-items: center; }

  /* ---------- day ---------- */
  .days { margin-top: 20px; transition: opacity 120ms var(--ease); }
  .days.fade { opacity: 0; }
  .day { margin-top: 12px; }
  .day-head { position: sticky; top: var(--hdr); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 8px 0 6px; }
  .day-head .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-left: var(--gutter); }
  .day-head .dl { font-size: 15px; font-weight: 600; }
  .day-head .dd { color: var(--muted); font-size: 12.5px; margin-left: 6px; font-weight: 400; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--tier) 72%, var(--fg)); background: color-mix(in srgb, var(--tier) 18%, transparent); white-space: nowrap; }
  .pill.none { color: var(--muted); background: var(--line-2); }
  .pill .mono { font-weight: 500; }
  .scale { height: 14px; margin-top: 3px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .scale .sc { position: relative; height: 100%; }
  .scale .sc span { position: absolute; top: 0; transform: translateX(-50%); }
  .scale .sc span.u { transform: none; right: 0; left: auto; }

  /* ---------- hour rows ---------- */
  .rows { position: relative; }
  .rows::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--line); border-radius: 1px; }
  .hr { position: relative; min-height: 32px; height: 32px; cursor: pointer; border-radius: 6px; transition: background 120ms var(--ease), opacity 200ms; }
  .hr:hover { background: var(--line-2); }
  .hr.past { opacity: 0.42; }
  .hr.past:hover { opacity: 0.8; }
  .hr.in-win { background: color-mix(in srgb, var(--tier) 6%, transparent); border-radius: 0; }
  .hr.in-win:hover { background: color-mix(in srgb, var(--tier) 12%, transparent); }
  .hr.win-start { border-radius: 6px 6px 0 0; }
  .hr.win-end { border-radius: 0 0 6px 6px; }
  .hr.win-start.win-end { border-radius: 6px; }
  .hr.in-win::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 4px; background: var(--tier); }
  .hr.win-start::before { top: 2px; border-radius: 2px 2px 0 0; }
  .hr.win-end::before { bottom: 2px; border-radius: 0 0 2px 2px; }
  .wlabel { position: absolute; left: 10px; top: 4px; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--tier); white-space: nowrap; pointer-events: none; }
  .hr.now::after { content: ""; position: absolute; left: 3px; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: translateY(-50%); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); z-index: 1; }
  .hr .time { font-family: var(--mono); font-size: 12px; color: var(--muted); position: relative; }
  .hr.now .time { color: var(--accent); font-weight: 500; }
  .nowchip { position: absolute; left: -2px; top: -13px; font-family: var(--font); font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .hr .verdict { justify-self: start; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; color: color-mix(in srgb, var(--tier) 72%, var(--fg)); background: color-mix(in srgb, var(--tier) 18%, transparent); white-space: nowrap; }
  .hr .verdict .cold { color: var(--accent); margin-left: 2px; }
  .bw { position: relative; height: 16px; }
  .bw .guide { position: absolute; top: -8px; bottom: -8px; border-left: 1px dashed color-mix(in srgb, var(--muted) 45%, transparent); }
  .bw .bs, .bw .bg { position: absolute; top: 2px; height: 12px; transform-origin: left center; }
  .bw .bs { left: 0; background: var(--tier); border-radius: 3px 0 0 3px; z-index: 1; }
  .bw .bg { background: color-mix(in srgb, var(--tier) 30%, transparent); border-radius: 0 3px 3px 0; }
  .bw .bs.only { border-radius: 3px; }
  .bw .nums { position: absolute; top: 0; line-height: 16px; font-family: var(--mono); font-size: 11px; color: var(--fg-2); white-space: nowrap; padding-left: 6px; }
  .bw .nums.inside { padding: 0 6px 0 0; transform: translateX(-100%); color: var(--fg); }
  .bw .nums .g { display: contents; color: var(--muted); }
  .hr .dir { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .hr .dir svg { width: 12px; height: 12px; color: var(--fg-2); }
  .hr .temp { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
  .hr .temp.cold { color: var(--avoid); }
  .det { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms var(--ease); }
  .det > div { overflow: hidden; }
  .det.open { grid-template-rows: 1fr; }
  .det p { margin: 0; padding: 4px 8px 10px calc(var(--gutter) + 8px); font-size: 12px; color: var(--fg-2); line-height: 1.5; }
  .det p b { color: var(--fg); font-weight: 600; }
  .det p .why { color: var(--tier); font-weight: 600; }
  .night { position: relative; height: 28px; display: flex; align-items: center; padding-left: var(--gutter); font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .night::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, var(--night) 0 3px, transparent 3px 6px); }
  .night.now { color: var(--accent); }
  .night.now::after { content: ""; position: absolute; left: 3px; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: translateY(-50%); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }

  /* ---------- enter animation ---------- */
  .days.enter .hr .bs, .days.enter .hr .bg { animation: grow 380ms var(--ease) both; animation-delay: min(calc(var(--i) * 8ms), 400ms); }
  .days.enter .hr .nums { animation: fin 300ms var(--ease) both; animation-delay: min(calc(var(--i) * 8ms + 200ms), 600ms); }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes fin { from { opacity: 0; } }

  /* ---------- skeleton / error ---------- */
  .sk { height: 32px; margin: 4px 0; border-radius: 6px; background: linear-gradient(90deg, var(--line-2) 25%, var(--line) 50%, var(--line-2) 75%); background-size: 200% 100%; animation: shim 1.3s infinite; }
  @keyframes shim { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .err { padding: 24px 0; color: var(--muted); font-size: 13.5px; }
  .err button { margin-left: 8px; padding: 6px 12px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 12.5px; }

  /* ---------- mobile ---------- */
  @media (max-width: 899px) {
    :root { --hdr: 92px; --gutter: 16px; }
    .app { display: block; }
    .mobile-head { display: block; position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .mh-row { display: flex; align-items: center; gap: 6px; padding: 10px 12px 6px 16px; }
    .mh-spot { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; text-align: left; }
    .mh-spot .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mh-spot svg { width: 16px; height: 16px; color: var(--muted); flex: none; transition: transform 200ms var(--ease); }
    .app.open .mh-spot svg { transform: rotate(180deg); }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: background 120ms, border-color 120ms; }
    .chip.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .chip .glance { font-size: 10.5px; }
    .chips .hint { font-size: 12px; color: var(--muted); padding: 5px 0; white-space: nowrap; }
    .rail { position: fixed; top: var(--hdr); left: 0; right: 0; bottom: auto; height: auto; z-index: 15; border-right: 0; transform: translateY(-10px); opacity: 0; pointer-events: none; transition: transform 220ms var(--ease), opacity 220ms var(--ease); border-radius: 0 0 var(--radius) var(--radius); max-height: 70vh; box-shadow: var(--shadow); }
    .app.open .rail { transform: none; opacity: 1; pointer-events: auto; }
    .rail-top { display: none; }
    .rail-foot { display: none; }
    .backdrop { display: block; position: fixed; inset: 0; z-index: 12; background: rgba(0, 0, 0, 0.35); opacity: 0; pointer-events: none; transition: opacity 220ms var(--ease); }
    .app.open .backdrop { opacity: 1; pointer-events: auto; }
    .stream { padding: 16px 12px 80px 14px; }
    .stream-head h1 { font-size: 22px; }
    .g { grid-template-columns: var(--gutter) 40px 46px minmax(0, 1fr) 26px 32px; column-gap: 6px; }
    .hr .dir .cp { display: none; }
    .hr .verdict { font-size: 11px; padding: 2px 5px; }
    .day-head .row1 { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Spots">
    <div class="rail-top">
      <div class="brand">supdawg<small>stream</small></div>
      <button class="icon-btn theme-toggle" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
    <div class="search">
      <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search a place in NL…" autocomplete="off" spellcheck="false" aria-label="Search a place" />
      <div class="results" id="results" role="listbox"></div>
    </div>
    <button class="spot-row" id="geo">
      <span class="n">📍 My location<span class="sub" id="geo-sub">Use GPS</span></span>
    </button>
    <div class="rail-label">Saved spots</div>
    <div id="spots"></div>
    <div class="rail-hint" id="rail-hint" hidden>Star a spot to keep it here</div>
    <div class="rail-foot"><span>Open-Meteo · PDOK</span><button class="icon-btn theme-toggle" title="Toggle theme" aria-label="Toggle theme"></button></div>
  </aside>

  <div class="mobile-head">
    <div class="mh-row">
      <button class="mh-spot" id="mh-spot" aria-expanded="false"><span class="n" id="mh-name">Locating…</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <button class="icon-btn theme-toggle" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="backdrop" id="backdrop"></div>

  <div class="stream-col">
    <main class="stream">
      <header class="stream-head">
        <h1><span id="spot-name">Locating…</span><button class="star" id="star" title="Save spot" aria-label="Save spot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4l-5.7 3.1 1.2-6.4L2.8 9.7l6.4-.8z"/></svg></button></h1>
        <p class="summary" id="summary">&nbsp;</p>
        <p class="legend"><i></i><i class="g"></i> bar = sustained wind, pale tail = gust · dashed lines = tier limits</p>
      </header>
      <div class="days" id="days"></div>
    </main>
  </div>
</div>

<script type="module">
import { DEFAULT_SPOT, TIERS, TIER_LABEL, findWindows, daySummary, compassShort, dayLabel, dayDate, fmtHour, fmtRange, searchPlaces, reverseName, locate, store, forecastFor, arrowRotation, nowKey, sameSpot } from "./core.js";

store.ns = "supdawg-b";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MAX_KMH = 50;
const THRESH = [10, 15, 20, 25];
const pct = (v) => Math.min(v, MAX_KMH) / MAX_KMH * 100;
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(ROTdeg)"><path d="M12 20V4m0 0-5 5m5-5 5 5"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

const state = { spot: null, forecast: null, spots: store.spots(), open: false, firstRender: true, userPicked: false };

/* ---------- theme ---------- */
const root = document.documentElement;
function applyTheme(t) { if (t) root.dataset.theme = t; else delete root.dataset.theme; const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; document.querySelectorAll(".theme-toggle").forEach((b) => (b.innerHTML = dark ? SUN : MOON)); }
applyTheme(store.get("theme"));
document.querySelectorAll(".theme-toggle").forEach((b) => b.addEventListener("click", () => { const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; const next = dark ? "light" : "dark"; store.set("theme", next); applyTheme(next); }));

/* ---------- glance badges (per spot, lazily) ---------- */
function glanceFor(f) {
  const now = nowKey();
  for (let i = 0; i < f.days.length; i++) {
    const d = f.days[i];
    const wins = findWindows(d.hours).filter((w) => i > 0 || d.date + "T" + String(w.endHour - 1).padStart(2, "0") >= now);
    if (!wins.length) continue;
    const s = daySummary(d.hours);
    const w = wins[0];
    const allDay = s.qualifyingHours === s.daylightHours;
    const day = i === 0 ? "Today" : i === 1 ? "Tmrw" : dayLabel(d.date).slice(0, 3);
    return { tier: w.modeTier, text: `${day} ${allDay ? "all day" : String(w.startHour).padStart(2, "0") + "–" + String(w.endHour).padStart(2, "0")}` };
  }
  return { tier: null, text: "—" };
}
function glanceEl(spot) {
  const g = el("span", "glance pending", `<i></i><span>…</span>`);
  forecastFor(spot).then((f) => { const r = glanceFor(f); g.classList.remove("pending"); g.className = "glance" + (r.tier ? " tier-" + r.tier : ""); g.lastChild.textContent = r.text; }).catch(() => { g.classList.remove("pending"); g.lastChild.textContent = "—"; });
  return g;
}

/* ---------- rail + chips ---------- */
function renderSpots() {
  const list = $("#spots"); list.innerHTML = "";
  $("#rail-hint").hidden = state.spots.length > 0;
  for (const s of state.spots) {
    const b = el("button", "spot-row has-rm" + (sameSpot(s, state.spot) ? " active" : ""));
    b.append(el("span", "n", esc(s.name)), glanceEl(s));
    const rm = el("button", "rm", "×"); rm.title = "Remove"; rm.setAttribute("aria-label", "Remove " + s.name);
    rm.addEventListener("click", (e) => { e.stopPropagation(); state.spots = store.removeSpot(s); renderSpots(); syncStar(); });
    b.append(rm);
    b.addEventListener("click", () => { state.userPicked = true; switchTo(s); });
    list.append(b);
  }
  const chips = $("#chips"); chips.innerHTML = "";
  if (!state.spots.length) chips.append(el("span", "hint", "Star a spot to keep it here"));
  for (const s of state.spots) {
    const c = el("button", "chip" + (sameSpot(s, state.spot) ? " active" : ""));
    c.append(el("span", null, esc(s.name.split(",")[0])), glanceEl(s));
    c.addEventListener("click", () => { state.userPicked = true; switchTo(s); });
    chips.append(c);
  }
}
function syncStar() {
  const on = state.spot && store.isSaved(state.spot);
  const st = $("#star"); st.classList.toggle("on", !!on); st.title = on ? "Remove from saved spots" : "Save spot";
}
$("#star").addEventListener("click", () => {
  if (!state.spot) return;
  const st = $("#star");
  state.spots = store.isSaved(state.spot) ? store.removeSpot(state.spot) : store.saveSpot(state.spot);
  st.classList.add("pop"); setTimeout(() => st.classList.remove("pop"), 200);
  renderSpots(); syncStar();
});

/* ---------- sheet (mobile) ---------- */
function setOpen(v) { state.open = v; $("#app").classList.toggle("open", v); $("#mh-spot").setAttribute("aria-expanded", String(v)); if (v) setTimeout(() => $("#q").focus(), 230); else closeResults(); }
$("#mh-spot").addEventListener("click", () => setOpen(!state.open));
$("#backdrop").addEventListener("click", () => setOpen(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (state.open) setOpen(false); closeResults(); } });

/* ---------- search ---------- */
const q = $("#q"), results = $("#results");
let hits = [], active = -1, timer = null, seq = 0;
function closeResults() { results.classList.remove("show"); results.innerHTML = ""; hits = []; active = -1; }
function renderResults() {
  results.innerHTML = "";
  hits.forEach((h, i) => {
    const b = el("button", i === active ? "active" : "", `${esc(h.name.split(",")[0])}<small>${esc(h.name.split(",").slice(1).join(",").trim() || h.type)}</small>`);
    b.setAttribute("role", "option");
    b.addEventListener("mousedown", (e) => { e.preventDefault(); pick(h); });
    results.append(b);
  });
  results.classList.add("show");
}
function pick(h) { q.value = ""; closeResults(); state.userPicked = true; switchTo({ name: h.name.split(",")[0], lat: h.lat, lon: h.lon }); setOpen(false); }
q.addEventListener("input", () => {
  const v = q.value.trim(); clearTimeout(timer);
  if (!v) return closeResults();
  timer = setTimeout(async () => {
    const my = ++seq;
    try { const r = await searchPlaces(v); if (my !== seq) return; hits = r; active = -1; if (!hits.length) { results.innerHTML = '<div class="empty">No matches</div>'; results.classList.add("show"); } else renderResults(); }
    catch { if (my !== seq) return; results.innerHTML = '<div class="empty">Search failed</div>'; results.classList.add("show"); }
  }, 200);
});
q.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" && hits.length) { e.preventDefault(); active = (active + 1) % hits.length; renderResults(); }
  else if (e.key === "ArrowUp" && hits.length) { e.preventDefault(); active = (active - 1 + hits.length) % hits.length; renderResults(); }
  else if (e.key === "Enter") { e.preventDefault(); const h = hits[active >= 0 ? active : 0]; if (h) pick(h); }
});
q.addEventListener("blur", () => setTimeout(closeResults, 150));

$("#geo").addEventListener("click", () => {
  const sub = $("#geo-sub");
  if (!navigator.geolocation) { sub.textContent = "Not available"; return; }
  sub.textContent = "Locating…";
  navigator.geolocation.getCurrentPosition(async (p) => {
    const lat = p.coords.latitude, lon = p.coords.longitude;
    const name = (await reverseName(lat, lon)) || "My location";
    sub.textContent = name; setOpen(false); state.userPicked = true; switchTo({ name, lat, lon });
  }, () => { sub.textContent = "Location denied"; }, { timeout: 8000, maximumAge: 600000 });
});

/* ---------- stream ---------- */
function reasonFor(h) {
  if (h.gustDowngraded) return `gust-limited → downgraded from ${TIER_LABEL[h.baseTier]}`;
  if (h.coldLimited) return "too cold to qualify (≤10°C)";
  if (h.tier === "avoid") return "sustained wind over 25 km/h";
  if (h.tier === "poor") return "sustained wind over 20 km/h";
  return "";
}
function scaleRow() {
  const r = el("div", "g scale");
  const sc = el("div", "sc");
  for (const t of THRESH) { const s = el("span", null, String(t)); s.style.left = pct(t) + "%"; sc.append(s); }
  sc.append(el("span", "u", "km/h"));
  r.append(el("span"), el("span"), el("span"), sc, el("span"), el("span"));
  return r;
}
function dayPill(s) {
  if (!s.best) return el("span", "pill none", "No window");
  const allDay = s.qualifyingHours === s.daylightHours;
  const w = s.best;
  return el("span", "pill tier-" + w.modeTier, allDay ? `${TIER_LABEL[w.modeTier]} all day` : `${TIER_LABEL[w.modeTier]} · <span class="mono">${String(w.startHour).padStart(2, "0")}–${String(w.endHour).padStart(2, "0")}</span>`);
}
function hourRow(h, i, nowH, isToday, win) {
  const wrap = el("div");
  const r = el("div", `g hr tier-${h.tier}`);
  r.style.setProperty("--i", i);
  if (isToday && h.hourNum < nowH) r.classList.add("past");
  if (isToday && h.hourNum === nowH) r.classList.add("now");
  if (win) { r.classList.add("in-win"); if (win.startHour === h.hourNum) r.classList.add("win-start"); if (win.endHour - 1 === h.hourNum) r.classList.add("win-end"); }
  const gutter = el("span");
  if (win && win.startHour === h.hourNum && win.hours.length >= 3) gutter.append(el("span", "wlabel", `${TIER_LABEL[win.modeTier]} · ${win.hours.length}h`));
  const time = el("span", "time", esc(h.hour)); if (r.classList.contains("now")) time.append(el("span", "nowchip", "now"));
  const verdict = el("span", "verdict", esc(TIER_LABEL[h.tier]) + (h.gustDowngraded ? "*" : "") + (h.coldLimited ? '<span class="cold">❄</span>' : ""));
  const bw = el("div", "bw");
  for (const t of THRESH) { const g = el("i", "guide"); g.style.left = pct(t) + "%"; bw.append(g); }
  const sp = pct(h.windKmh), gp = pct(Math.max(h.gustKmh, h.windKmh));
  const bs = el("i", "bs" + (gp - sp < 0.5 ? " only" : "")); bs.style.width = sp + "%";
  const bg = el("i", "bg"); bg.style.left = sp + "%"; bg.style.width = Math.max(gp - sp, 0) + "%";
  const nums = el("span", "nums", `${Math.round(h.windKmh)}<span class="g"> / ${Math.round(h.gustKmh)}</span>`);
  if (gp > 74) { nums.classList.add("inside"); nums.style.left = gp + "%"; } else nums.style.left = gp + "%";
  bw.append(bs, bg, nums);
  const dir = el("span", "dir", ARROW.replace("ROT", arrowRotation(h.windDirDeg)) + `<span class="cp">${compassShort(h.windDirDeg)}</span>`);
  dir.title = `Wind from ${compassShort(h.windDirDeg)} (${Math.round(h.windDirDeg)}°)`;
  const temp = el("span", "temp" + (h.coldLimited ? " cold" : ""), `${Math.round(h.tempC)}°`);
  r.append(gutter, time, verdict, bw, dir, temp);
  const why = reasonFor(h);
  const det = el("div", `det tier-${h.tier}`, `<div><p><b>${esc(h.hour)}</b> · wind ${h.windKmh} km/h, gust ${h.gustKmh} km/h (+${Math.round(h.gustKmh - h.windKmh)}, ${(h.gustKmh / Math.max(h.windKmh, 1)).toFixed(1)}×) · from ${compassShort(h.windDirDeg)} ${Math.round(h.windDirDeg)}° · ${h.tempC}°C${why ? ` · <span class="why">${esc(why)}</span>` : ""}</p></div>`);
  r.addEventListener("click", () => { const was = det.classList.contains("open"); document.querySelectorAll(".det.open").forEach((d) => d.classList.remove("open")); if (!was) det.classList.add("open"); });
  wrap.append(r, det);
  return wrap;
}
function nightRow(from, to, isNow) {
  const n = el("div", "night" + (isNow ? " now" : ""), `🌙&nbsp; ${fmtHour(from)} → ${to == null ? "night" : fmtHour(to)}${isNow ? " · now" : ""}`);
  return n;
}
function renderDays(f) {
  const days = $("#days"); days.innerHTML = "";
  const now = nowKey(); const nowDate = now.slice(0, 10); const nowH = Number(now.slice(11, 13));
  let i = 0;
  f.days.forEach((d, di) => {
    const daylight = d.hours.filter((h) => h.isDaylight);
    if (!daylight.length) return;
    const isToday = d.date === nowDate;
    const sec = el("section", "day");
    const head = el("div", "day-head");
    const row1 = el("div", "row1");
    row1.append(el("span", "dl", `${esc(dayLabel(d.date))}<span class="dd">${esc(dayDate(d.date))}</span>`), dayPill(daySummary(d.hours)));
    head.append(row1, scaleRow());
    const rows = el("div", "rows");
    const wins = findWindows(d.hours);
    for (const h of daylight) rows.append(hourRow(h, i++, nowH, isToday, wins.find((w) => h.hourNum >= w.startHour && h.hourNum < w.endHour)));
    const sunsetH = daylight[daylight.length - 1].hourNum + 1;
    const next = f.days[di + 1]; const nextDl = next ? next.hours.find((h) => h.isDaylight) : null;
    const nightNow = isToday && nowH >= sunsetH || (next && next.date === nowDate && nextDl && nowH < nextDl.hourNum);
    rows.append(nightRow(sunsetH, nextDl ? nextDl.hourNum : null, nightNow));
    sec.append(head, rows); days.append(sec);
  });
}
function summaryHtml(f) {
  const now = nowKey(); const nowDate = now.slice(0, 10); const nowH = Number(now.slice(11, 13));
  const wins = findWindows(f.hours).filter((w) => w.date > nowDate || (w.date === nowDate && w.endHour > nowH));
  if (!wins.length) return "No good window in the next 4 days.";
  const w = wins[0];
  const s = daySummary(f.days.find((d) => d.date === w.date).hours);
  const allDay = s.qualifyingHours === s.daylightHours;
  const label = `<span class="t tier-${w.modeTier}">${TIER_LABEL[w.modeTier]}</span>`;
  if (w.date === nowDate && w.startHour <= nowH) return `${label} <b>now</b> until <b>${fmtHour(w.endHour)}</b>${allDay ? " (all day)" : ""}.`;
  const todayHas = wins.some((x) => x.date === nowDate);
  const when = `<b>${dayLabel(w.date)} ${allDay ? fmtHour(w.startHour) : fmtRange(w)}</b>`;
  return (w.date === nowDate || todayHas ? "Next good window: " : "Nothing more today · next: ") + `${when} (${label}${allDay ? ", all day" : ""}).`;
}
function scrollToNow(smooth = true) {
  const t = $(".hr.now") || $(".night.now"); if (!t) return;
  const top = t.getBoundingClientRect().top;
  // Only move when "now" is out of the comfortable zone, so the spot summary
  // above the stream stays on screen in the common morning/midday case.
  if (top > 0 && top < window.innerHeight * 0.6) return;
  const y = top + window.scrollY - window.innerHeight / 3;
  window.scrollTo({ top: Math.max(y, 0), behavior: smooth ? "smooth" : "auto" });
}
function showSkeleton() { const d = $("#days"); d.innerHTML = ""; for (let i = 0; i < 14; i++) { const s = el("div", "sk"); s.style.width = (60 + Math.random() * 40) + "%"; d.append(s); } }
function showError(spot) { const d = $("#days"); d.innerHTML = ""; const e = el("div", "err", "Couldn't load the forecast."); const b = el("button", null, "Retry"); b.addEventListener("click", () => switchTo(spot, true)); e.append(b); d.append(e); }

let renderSeq = 0;
async function switchTo(spot, force = false) {
  if (!force && state.spot && sameSpot(spot, state.spot)) { setOpen(false); return; }
  const my = ++renderSeq;
  state.spot = spot; store.set("lastSpot", { name: spot.name, lat: spot.lat, lon: spot.lon });
  $("#spot-name").textContent = spot.name; $("#mh-name").textContent = spot.name;
  document.title = `${spot.name} · supdawg`;
  syncStar(); renderSpots();
  const days = $("#days");
  const first = state.firstRender; state.firstRender = false;
  if (first) showSkeleton(); else { days.classList.add("fade"); await new Promise((r) => setTimeout(r, 120)); if (my !== renderSeq) return; }
  try {
    const f = await forecastFor(spot);
    if (my !== renderSeq) return;
    state.forecast = f;
    $("#summary").innerHTML = summaryHtml(f);
    days.classList.remove("enter"); renderDays(f);
    void days.offsetWidth; days.classList.add("enter"); days.classList.remove("fade");
    setTimeout(() => scrollToNow(true), first ? 300 : 60);
  } catch (e) {
    if (my !== renderSeq) return;
    console.error(e); days.classList.remove("fade"); $("#summary").textContent = ""; showError(spot);
  }
}

/* ---------- boot ---------- */
renderSpots();
showSkeleton();
// locate() can hang on an unanswered GPS permission prompt; fall back to the
// default spot after 2.5s, and still honour a late GPS fix unless the user
// has picked a spot themselves by then.
locate().then((s) => { if (!state.userPicked) switchTo({ name: s.name, lat: s.lat, lon: s.lon }); });
setTimeout(() => { if (!state.spot) switchTo({ ...DEFAULT_SPOT }); }, 2500);
</script>
</body>
</html>
